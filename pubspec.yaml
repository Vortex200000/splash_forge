name: splash_forge
description: Generate Android splash icons for Android 12+ and legacy versions.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State management and DI
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  get_it: ^8.0.0

  # Either (success or failure)
  dartz: ^0.10.1

  # Export
  archive: ^4.0.0
  file_saver: ^0.2.14

  # UI helpers
  file_picker: ^10.3.8
  flutter_colorpicker: ^1.1.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.jpeg"
